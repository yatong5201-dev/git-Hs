<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待办清单</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <p class="eyebrow">Today</p>
      <h1>待办清单 v1</h1>
      <p class="subtitle" id="summary">把今天要做的事记下来</p>
    </header>

    <form class="composer" id="composer">
      <input
        id="new-todo"
        type="text"
        maxlength="120"
        placeholder="添加一件事，回车即可"
        autocomplete="off"
        aria-label="新待办"
      >
      <button type="submit">添加</button>
    </form>

    <div class="toolbar">
      <div class="filters" role="tablist" aria-label="筛选待办">
        <button type="button" class="filter is-active" data-filter="all">全部</button>
        <button type="button" class="filter" data-filter="active">未完成</button>
        <button type="button" class="filter" data-filter="done">已完成</button>
      </div>
      <button type="button" class="text-btn" id="clear-done">清除已完成</button>
    </div>

    <ul class="list" id="list"></ul>

    <p class="empty" id="empty" hidden>这一栏还是空的</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
